[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ellipt"
version = "1.0.0"
description = "Truncate strings with an ellipsis at the start, middle or end, by characters, grapheme clusters, display columns or UTF-8 bytes, without splitting emoji or accents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSE-UNICODE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["ellipsis", "truncate", "shorten", "string", "unicode", "grapheme", "display-width", "path", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Topic :: Terminals",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: General",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
ellipt = "ellipt._cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-timeout", "build", "twine", "wcwidth==0.9.2"]

[project.urls]
Homepage = "https://lianes8studio.com"
Source = "https://github.com/JaviLianes8/ellipt"
Issues = "https://github.com/JaviLianes8/ellipt/issues"
Changelog = "https://github.com/JaviLianes8/ellipt/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.sdist]
# The Unicode data files are fetched locally and never shipped; only their manifest is.
include = [
    "src",
    "tests",
    "scripts/gen_ucd_tables.py",
    "scripts/fetch_upstream.py",
    "data/ucd/MANIFEST.json",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "GUIDE.md",
]
exclude = ["**/__pycache__"]

[tool.hatch.build.targets.wheel]
packages = ["src/ellipt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use look-alike characters (fullwidth, ellipsis, accents) on purpose.
"tests/*" = ["RUF001", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
timeout = 300
